<!-- GSAP: core + ScrollTrigger (deferred, non-blocking) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Hero title raining letters + ScrollTrigger init -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  function initGSAP() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
      setTimeout(initGSAP, 50);
      return;
    }
    gsap.registerPlugin(ScrollTrigger);

    // === HERO: Raining Letters ===
    var title = document.getElementById('hero-title');
    if (title) {
      var text = title.textContent;
      var isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      // Manual text split
      title.innerHTML = text.split('').map(function(ch, i) {
        if (ch === ' ') return ' ';
        return '<span class="char" data-char="' + i + '"><span>' + ch + '</span></span>';
      }).join('');

      var chars = title.querySelectorAll('.char > span');

      function rainIn() {
        gsap.to(chars, {
          yPercent: 100,
          duration: 0.6,
          ease: 'elastic.out(1, 0.5)',
          stagger: { each: 0.03, from: 'random' },
        });
      }

      function rainOut() {
        gsap.to(chars, {
          yPercent: 0,
          duration: 0.6,
          ease: 'elastic.out(1, 0.5)',
          stagger: { each: 0.03, from: 'random' },
        });
      }

      if (isMobile) {
        var isRaining = false;
        function mobileLoop() {
          if (isRaining) return;
          isRaining = true;
          rainIn();
          setTimeout(function() { rainOut(); isRaining = false; }, 1200);
        }
        setTimeout(mobileLoop, 800);
        setInterval(mobileLoop, 3000);
      } else {
        var hero = document.getElementById('hero-section');
        hero.addEventListener('pointerenter', rainIn);
        hero.addEventListener('pointerleave', rainOut);
      }
    }

    // === MASONRY: ScrollTrigger reveal ===
    // Expose for index.js to call after grid is populated
    window.initMasonryAnimations = function() {
      var items = document.querySelectorAll('.masonry-item');
      if (items.length === 0) return;

      gsap.set(items, { opacity: 0, y: 40 });

      items.forEach(function(item) {
        gsap.to(item, {
          opacity: 1,
          y: 0,
          duration: 0.7,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: item,
            start: 'top 90%',
            toggleActions: 'play none none none',
            once: true,
          },
        });
      });
    };
  }

  initGSAP();
});
</script>
